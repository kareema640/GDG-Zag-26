<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; line-height: 1.8; }
        form { max-width: 400px; margin: auto; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        div { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    </style>
</head>
<body>
    <form id="userForm">
        <h3>Data</h3>
        <div>
            <label>Name:</label>
            <input type="text" id="userName" placeholder="Enter Your Name">
        </div>
        <div>
            <label>Email :</label>
            <input type="email" id="userEmail" placeholder="Enter your email">
        </div>
        <div>
            <label>Birth date:</label>
            <input type="date" id="userBirthdate">
        </div>
        <div>
            <label>Job :</label>
            <select id="userJob">
                <option value="none" selected disabled>Choose Your Job</option>
                <option value="frontend">Front-End Developer</option>
                <option value="backend">Back-End Developer</option>
                <option value="mobile">Mobile App Developer</option>
                <option value="uiux">UI/UX Designer</option>
                <option value="embedded">Embedded Systems Engineer</option>
            </select>
        </div>
    </form>
    <script src="./task1_2.js"></script>
</body>
</html>
